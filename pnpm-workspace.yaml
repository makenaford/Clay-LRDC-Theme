# pnpm workspace config. This is a single-package repo (no `packages:` globs needed) — this file
# exists to hold pnpm 11's workspace-level settings, which no longer live in .npmrc.

# Fail fast if the running Node version doesn't satisfy package.json's "engines" field, instead of
# warning and continuing.
engineStrict: true

# Supply-chain protection: refuse to install a dependency version (direct or transitive) until
# it's been published for at least this long, giving the community time to catch and yank
# malicious or compromised releases. 1 week = 7 * 24 * 60 minutes.
minimumReleaseAge: 10080

# Only direct dependencies may resolve from a non-registry ("exotic") source, such as a git URL or
# a tarball URL — a transitive/sub-dependency pinned to one of those can't sneak in unreviewed.
blockExoticSubdeps: true

# Refuse to install a package whose publisher trust level (e.g. provenance/attestation) has
# dropped compared to a version already in the lockfile.
trustPolicy: no-downgrade

# ...but don't enforce that check forever — once a version has been out this long, treat its
# trust level as settled rather than re-litigating it. A quarter year = 91 days in minutes.
trustPolicyIgnoreAfter: 131040

# esbuild (a transitive build tool for Vite) has a postinstall script that fetches its platform
# binary — required for the build to work, so it's explicitly allowed to run.
allowBuilds:
  # sass pulls in @parcel/watcher for its --watch mode, which this repo does not use. Denying its
  # native postinstall keeps one less build script running; recording the decision either way is
  # what stops pnpm treating it as an unresolved prompt.
  '@parcel/watcher': false
  esbuild: true

# --- Clay pinning + trust exemption ---------------------------------------------------------
#
# Clay releases 3.164.0 and later were published WITHOUT the trusted-publisher attestation that
# earlier Clay releases carried. `trustPolicy: no-downgrade` reads that drop as a possible package
# takeover and refuses the install. Release age is NOT the blocker here — 3.166.0 is well past the
# 7-day floor above, so `minimumReleaseAge` needs no exemption and stays fully in force.
#
# We accept the trust drop for Clay specifically, at these exact versions. Naming the version
# matters: pnpm allows a bare `@clayui/*` glob, but that would exempt Clay from trust checks
# forever, including a genuinely compromised future release. Pinned this way, 3.167.0 would be
# re-checked and rejected until it is reviewed and added here deliberately.
#
# Remove these entries once Clay publishes with provenance restored.
trustPolicyExclude:
  - "@clayui/alert@3.166.0"
  - "@clayui/badge@3.166.0"
  - "@clayui/button@3.166.0"
  - "@clayui/card@3.166.0"
  - "@clayui/core@3.166.0"
  - "@clayui/css@3.166.0"
  - "@clayui/data-provider@3.166.0"
  - "@clayui/drop-down@3.166.0"
  - "@clayui/form@3.166.0"
  - "@clayui/icon@3.166.0"
  - "@clayui/label@3.166.0"
  - "@clayui/layout@3.166.0"
  - "@clayui/link@3.166.0"
  - "@clayui/loading-indicator@3.166.0"
  - "@clayui/modal@3.166.0"
  - "@clayui/nav@3.166.0"
  - "@clayui/provider@3.166.0"
  - "@clayui/shared@3.166.0"
  - "@clayui/sticker@3.166.0"
  - "@clayui/table@3.166.0"
  - "@clayui/tooltip@3.166.0"

# Clay ships its whole package set in lockstep and its internal deps use caret ranges, so without
# these overrides transitive Clay packages would resolve independently of the direct ones.
overrides:
  "@clayui/alert": 3.166.0
  "@clayui/badge": 3.166.0
  "@clayui/button": 3.166.0
  "@clayui/card": 3.166.0
  "@clayui/core": 3.166.0
  "@clayui/css": 3.166.0
  "@clayui/data-provider": 3.166.0
  "@clayui/drop-down": 3.166.0
  "@clayui/form": 3.166.0
  "@clayui/icon": 3.166.0
  "@clayui/label": 3.166.0
  "@clayui/layout": 3.166.0
  "@clayui/link": 3.166.0
  "@clayui/loading-indicator": 3.166.0
  "@clayui/modal": 3.166.0
  "@clayui/nav": 3.166.0
  "@clayui/provider": 3.166.0
  "@clayui/shared": 3.166.0
  "@clayui/sticker": 3.166.0
  "@clayui/table": 3.166.0
  "@clayui/tooltip": 3.166.0
